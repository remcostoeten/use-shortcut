name: CI

on:
    push:
        branches:
            - v3
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun run check:package
            - run: bunx playwright install --with-deps chromium
            - run: bun run e2e

    react-18:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun add -d react@18 react-dom@18 @types/react@18 @types/react-dom@18
            - run: bunx tsc
            - run: bun test __tests__
